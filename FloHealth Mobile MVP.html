function PositionalInsights({team}){
  const [session,setSession]=useState('Game');
  const [range,setRange]=useState('Last 4 Games');
  const [from,setFrom]=useState('');
  const [to,setTo]=useState('');
  const [busy,setBusy]=useState(false);
  const [out,setOut]=useState(null);
  const RANGES=['Last Game','Last 4 Games','Last 7 Days','Last 30 Days','Full Season','Custom Range'];
  React.useEffect(()=>{setOut(null);},[team]);
  const ins={width:'100%',font:'600 10px/1 var(--font)',color:'var(--ink)',border:'1px solid var(--line)',borderRadius:7,padding:'8px 6px',background:'var(--surface)',outline:'none',boxSizing:'border-box'};
  const lbl={font:'700 8px/1 var(--font)',color:'var(--faint)',letterSpacing:'.4px',textTransform:'uppercase',display:'block',marginBottom:3};

  const generate=()=>{
    setBusy(true);
    const opt=TEAM_OPTS.find(o=>o.k===team);
    let plays=[];
    try{plays=JSON.parse(localStorage.getItem('flo_plays_'+opt.t)||'[]');}catch(e){}
    if(range==='Custom Range'&&(from||to)){
      const f=from?new Date(from).getTime():0;
      const t=to?new Date(to).getTime()+86400000:Infinity;
      plays=plays.filter(p=>p.id>=f&&p.id<=t);
    } else if(range==='Last Game') plays=plays.slice(0,12);
    else if(range==='Last 7 Days') plays=plays.filter(p=>p.id>=Date.now()-6048e5);
    else if(range==='Last 30 Days') plays=plays.filter(p=>p.id>=Date.now()-2592e6);
    /* Real tally from the recorded formations + play results. */
    const tally={};
    plays.forEach(p=>{if(!p.off||p.off==='Custom')return;
      tally[p.off]=tally[p.off]||{n:0,pos:0};
      tally[p.off].n++;
      if(p.result==='Scored'||p.result==='Big Gain') tally[p.off].pos++;});
    const measured=Object.entries(tally).sort((a,b)=>b[1].n-a[1].n).slice(0,3)
      .map(([k,v])=>`${k} produced a positive result on ${Math.round(v.pos/v.n*100)}% of ${v.n} recorded play${v.n===1?'':'s'}.`);
    setTimeout(()=>{setOut({count:plays.length,measured,lib:INSIGHT_LIB[team]||INSIGHT_LIB.football,session,range});setBusy(false);},550);
  };

  return(
    <div className="card" style={{marginBottom:12}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
        <span style={{fontSize:22}}>🧠</span>
        <span style={{font:'700 15px/1 var(--font)',color:'var(--ink)'}}>Positional Insights</span>
      </div>
      <p style={{font:'400 12px/1.5 var(--font)',color:'var(--faint)',marginBottom:12}}>Patterns from your saved field positions and play context — not box-score stats.</p>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7,marginBottom:8}}>
        <div>
          <label style={lbl}>Session</label>
          <select value={session} onChange={e=>setSession(e.target.value)} style={ins}>
            {['Game','Practice','Both'].map(o=><option key={o} value={o}>{o}</option>)}
          </select>
        </div>
        <div>
          <label style={lbl}>Time Frame</label>
          <select value={range} onChange={e=>setRange(e.target.value)} style={ins}>
            {RANGES.map(o=><option key={o} value={o}>{o}</option>)}
          </select>
        </div>
      </div>
      {range==='Custom Range'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7,marginBottom:8}}>
        <div><label style={lbl}>From</label><input type="date" value={from} onChange={e=>setFrom(e.target.value)} style={ins}/></div>
        <div><label style={lbl}>To</label><input type="date" value={to} onChange={e=>setTo(e.target.value)} style={ins}/></div>
      </div>}
      <button onClick={generate} disabled={busy} style={{width:'100%',background:busy?'var(--t-400)':'var(--t-500)',border:'none',borderRadius:10,padding:'11px',font:'700 12px/1 var(--font)',color:'#fff',cursor:busy?'default':'pointer'}}>{busy?'Analyzing positions…':'Generate Insights'}</button>
      {out&&<div style={{marginTop:12}}>
        <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',marginBottom:10,paddingBottom:10,borderBottom:'1px solid var(--line)'}}>
          <span style={{font:'700 8px/1 var(--font)',color:'var(--t-600)',background:'var(--t-50)',borderRadius:4,padding:'4px 6px'}}>{out.session}</span>
          <span style={{font:'700 8px/1 var(--font)',color:'var(--t-600)',background:'var(--t-50)',borderRadius:4,padding:'4px 6px'}}>{out.range}</span>
          <span style={{font:'400 10px/1 var(--font)',color:'var(--faint)'}}>{out.count} recorded play{out.count===1?'':'s'} analyzed</span>
        </div>
        {out.count===0&&<div style={{font:'400 11px/1.5 var(--font)',color:'var(--faint)',background:'var(--bg)',border:'1px dashed var(--line)',borderRadius:8,padding:'10px 11px',marginBottom:10}}>No plays recorded for this range yet. Insights below are illustrative — record plays from the field view to ground them in your own data.</div>}
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {INSIGHT_CATS.map(c=>{
            const lines=(c.k==='form'&&out.measured.length)?out.measured:(out.lib[c.k]||[]);
            return(
              <div key={c.k} style={{background:'var(--t-50)',border:'1px solid var(--t-200)',borderRadius:10,padding:'10px 11px'}}>
                <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:6}}>
                  <span style={{fontSize:14}}>{c.icon}</span>
                  <span style={{font:'700 11px/1 var(--font)',color:'var(--t-600)'}}>{c.label}</span>
                  {c.k==='form'&&out.measured.length>0&&<span style={{font:'700 7px/1 var(--font)',color:'#fff',background:'var(--t-500)',borderRadius:3,padding:'3px 4px',letterSpacing:'.3px'}}>FROM YOUR DATA</span>}
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:5}}>
                  {lines.map((s,i)=>(
                    <div key={i} style={{display:'flex',gap:6}}>
                      <span style={{color:'var(--t-500)',font:'700 11px/1.45 var(--font)',flexShrink:0}}>•</span>
                      <span style={{font:'400 11px/1.45 var(--font)',color:'var(--ink)'}}>{s}</span>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      </div>}
    </div>
  );
}

/* Straightforward, computed play analytics — no prediction, just counts and
   rates derived from the coach's own recorded positions. */
function PlayAnalytics({team}){
  const opt=TEAM_OPTS.find(o=>o.k===team)||TEAM_OPTS[0];
  const [plays,setPlays]=useState([]);
  React.useEffect(()=>{try{setPlays(JSON.parse(localStorage.getItem('flo_plays_'+opt.t)||'[]'));}catch(e){setPlays([]);}},[team]);
  const isPos=p=>p.result==='Scored'||p.result==='Big Gain';
  const offT={},comboT={},lineupT={};
  plays.forEach(p=>{
    if(p.off&&p.off!=='Custom'){offT[p.off]=offT[p.off]||{n:0,pos:0};offT[p.off].n++;if(isPos(p))offT[p.off].pos++;}
    if(p.off||p.def){const c=(p.off||'—')+' vs '+(p.def||'—');comboT[c]=comboT[c]||{n:0,pos:0};comboT[c].n++;if(isPos(p))comboT[c].pos++;}
    const lu=(p.nodes||[]).filter(n=>n.team==='home'&&n.init&&n.init!==n.pos).map(n=>n.init).sort().join(' · ');
    if(lu){lineupT[lu]=lineupT[lu]||{n:0,pos:0};lineupT[lu].n++;if(isPos(p))lineupT[lu].pos++;}
  });
  const byUse=t=>Object.entries(t).sort((a,b)=>b[1].n-a[1].n);
  const byRate=t=>Object.entries(t).sort((a,b)=>(b[1].pos/b[1].n)-(a[1].pos/a[1].n)||b[1].n-a[1].n);
  const mostUsed=byUse(offT)[0], best=byRate(offT)[0], mostPlay=byUse(comboT)[0];
  const timeline=[...plays].reverse();
  const heat=plays.flatMap(p=>(p.nodes||[]).filter(n=>n.team==='home'));
  const HW=300,HH=140;
  const STAT=[
    {label:'Most Used Formation',val:mostUsed?mostUsed[0]:'—',sub:mostUsed?mostUsed[1].n+' plays':'no data'},
    {label:'Most Successful Formation',val:best?best[0]:'—',sub:best?Math.round(best[1].pos/best[1].n*100)+'% positive':'no data'},
    {label:'Most Used Play',val:mostPlay?mostPlay[0]:'—',sub:mostPlay?mostPlay[1].n+'\u00d7 called':'no data'},
    {label:'Plays Recorded',val:String(plays.length),sub:opt.label.replace(/^\S+\s/,'')},
  ];
  const Sec=({title,children})=>(
    <div style={{marginTop:12,paddingTop:11,borderTop:'1px solid var(--line)'}}>
      <div style={{font:'700 9px/1 var(--font)',color:'var(--faint)',letterSpacing:'.6px',textTransform:'uppercase',marginBottom:8}}>{title}</div>
      {children}
    </div>
  );
  return(
    <div className="card" style={{marginBottom:12}}>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
        <span style={{fontSize:22}}>📈</span>
        <span style={{font:'700 15px/1 var(--font)',color:'var(--ink)'}}>Play Analytics</span>
      </div>
      <p style={{font:'400 12px/1.5 var(--font)',color:'var(--faint)',marginBottom:12}}>Counted straight from your recorded plays — no prediction involved.</p>
      {plays.length===0
        ? <div style={{font:'400 11px/1.5 var(--font)',color:'var(--faint)',background:'var(--bg)',border:'1px dashed var(--line)',borderRadius:8,padding:'12px'}}>Nothing recorded for this team yet. Open the field view, pick a formation, and tap Record Play — these numbers fill in as you go.</div>
        : <>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            {STAT.map(s=>(
              <div key={s.label} style={{background:'var(--t-50)',borderRadius:10,padding:'10px 11px'}}>
                <div style={{font:'400 9px/1.2 var(--font)',color:'var(--faint)',marginBottom:4}}>{s.label}</div>
                <div style={{font:'700 12px/1.25 var(--font)',color:'var(--t-600)'}}>{s.val}</div>
                <div style={{font:'400 9px/1.2 var(--font)',color:'var(--faint)',marginTop:3}}>{s.sub}</div>
              </div>
            ))}
          </div>
          {byUse(offT).length>0&&<Sec title="Success Rate by Formation">
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {byUse(offT).map(([k,v])=>{const pct=Math.round(v.pos/v.n*100);return(
                <div key={k}>
                  <div style={{display:'flex',justifyContent:'space-between',gap:8,marginBottom:3}}>
                    <span style={{font:'600 10px/1.2 var(--font)',color:'var(--ink)'}}>{k}</span>
                    <span style={{font:'700 10px/1.2 var(--font)',color:'var(--t-600)',flexShrink:0}}>{pct}% <span style={{color:'var(--faint)',fontWeight:400}}>({v.n})</span></span>
                  </div>
                  <div style={{height:5,background:'var(--line)',borderRadius:3,overflow:'hidden'}}><div style={{width:pct+'%',height:'100%',background:'var(--t-500)'}}/></div>
                </div>
              );})}
            </div>
          </Sec>}
          {byUse(lineupT).length>0&&<Sec title="Frequently Used Lineups">
            <div style={{display:'flex',flexDirection:'column',gap:5}}>
              {byUse(lineupT).slice(0,3).map(([k,v])=>(
                <div key={k} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,background:'var(--bg)',border:'1px solid var(--line)',borderRadius:7,padding:'7px 9px'}}>
                  <span style={{font:'600 10px/1.3 var(--font)',color:'var(--ink)'}}>{k}</span>
                  <span style={{flexShrink:0,font:'700 9px/1 var(--font)',color:'var(--t-600)'}}>{v.n}× · {Math.round(v.pos/v.n*100)}%</span>
                </div>
              ))}
            </div>
          </Sec>}
          {byUse(comboT).length>0&&<Sec title="Favorite Plays (by coach usage)">
            <div style={{display:'flex',flexDirection:'column',gap:5}}>
              {byUse(comboT).slice(0,3).map(([k,v],i)=>(
                <div key={k} style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{font:'700 9px/1 var(--font)',color:'#fff',background:'var(--t-500)',borderRadius:4,width:16,height:16,display:'grid',placeItems:'center',flexShrink:0}}>{i+1}</span>
                  <span style={{flex:1,font:'500 10px/1.3 var(--font)',color:'var(--ink)'}}>{k}</span>
                  <span style={{flexShrink:0,font:'700 9px/1 var(--font)',color:'var(--faint)'}}>{v.n}×</span>
                </div>
              ))}
            </div>
          </Sec>}
          <Sec title="Play Success Timeline">
            <div style={{display:'flex',alignItems:'flex-end',gap:3,height:38,marginBottom:5}}>
              {timeline.map((p,i)=>(
                <div key={i} title={(p.period||'')+' '+(p.result||'—')} style={{flex:1,minWidth:3,height:isPos(p)?'100%':'46%',background:isPos(p)?'var(--t-500)':'var(--line)',borderRadius:2}}/>
              ))}
            </div>
            <div style={{display:'flex',justifyContent:'space-between',font:'400 8px/1 var(--font)',color:'var(--faint)'}}>
              <span>Oldest</span><span>{timeline.filter(isPos).length} of {timeline.length} positive</span><span>Latest</span>
            </div>
          </Sec>
          <Sec title="Player Position Heat Map">
            <svg width="100%" viewBox={`0 0 ${HW} ${HH}`} style={{display:'block',borderRadius:8,background:'#2d5a27'}}>
              <rect x={1} y={1} width={HW-2} height={HH-2} rx={6} fill="none" stroke="rgba(255,255,255,.5)" strokeWidth={1.2}/>
              <line x1={HW/2} y1={1} x2={HW/2} y2={HH-1} stroke="rgba(255,255,255,.35)" strokeWidth={1} strokeDasharray="4 4"/>
              {heat.map((n,i)=>(<circle key={i} cx={n.x*HW} cy={n.y*HH} r={7} fill="#2DD4BF" opacity={0.16}/>))}
            </svg>
            <div style={{font:'400 9px/1.3 var(--font)',color:'var(--faint)',marginTop:5,textAlign:'center'}}>{heat.length} position points across {plays.length} play{plays.length===1?'':'s'} — brighter clusters are where your players line up most.</div>
          </Sec>
        </>}
    </div>
  );
}

function CStats(){

      {label:'Avg Readiness',val:'87%'},{label:'Avg Performance',val:'82%'},{label:'Avg Recovery',val:'79%'},{label:'Top Performer','val':'Marcus R.'},
    ]},
    {key:'readiness',label:'Readiness Trends',icon:'💡',desc:'How team readiness has shifted over the last 4 weeks.',items:[
      {label:'Week 1',val:'84%'},{label:'Week 2',val:'88%'},{label:'Week 3',val:'83%'},{label:'Week 4',val:'87%'},
    ]},
    {key:'attendance',label:'Attendance',icon:'✅',desc:'Practice and session attendance rates.',items:[
      {label:'This Week',val:'92%'},{label:'Last Week',val:'88%'},{label:'Month Avg',val:'90%'},{label:'Perfect Attendance',val:'4 athletes'},

      {label:'Active Injuries',val:'2'},{label:'In Recovery',val:'1'},{label:'Cleared This Week',val:'1'},{label:'Avg Recovery Time',val:'6 days'},
    ]},

  return(<div style={{paddingBottom:80}}>
    <div className="app-header">
      <div className="app-greeting">Team Insight</div>
      <div className="app-date">Season Overview</div>
    </div>
    <div style={{padding:'0 12px 12px'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
        <span style={{font:'700 9px/1 var(--font)',color:'var(--faint)',letterSpacing:'.6px',textTransform:'uppercase',flexShrink:0}}>Team</span>
        <select value={team} onChange={e=>setTeam(e.target.value)} style={{flex:1,font:'600 11px/1 var(--font)',color:'var(--ink)',border:'1px solid var(--t-400)',borderRadius:8,padding:'8px 8px',background:'var(--surface)',outline:'none'}}>
          {TEAM_OPTS.map(o=><option key={o.k} value={o.k}>{o.label}</option>)}
        </select>
      </div>
      <PlayAnalytics team={team}/>
      <PositionalInsights team={team}/>
      {CATS.map(c=>(
        <div key={c.key} className="card" style={{marginBottom:12}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
            <span style={{fontSize:22}}>{c.icon}</span>
            <span style={{font:'700 15px/1 var(--font)',color:'var(--ink)'}}>{c.label}</span>
          </div>
          <p style={{font:'400 13px/1.5 var(--font)',color:'var(--faint)',marginBottom:12}}>{c.desc}</p>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            {c.items.map((it,i)=>(
              <div key={i} style={{background:'var(--t-50)',borderRadius:10,padding:'10px 12px'}}>
                <div style={{font:'400 11px/1 var(--font)',color:'var(--faint)',marginBottom:4}}>{it.label}</div>
                <div style={{font:'700 15px/1 var(--font)',color:'var(--t-600)'}}>{it.val}</div>
              </div>

          </div>

}


function NavIcon({tab}){
  const s={width:20,height:20,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"};
  if(tab==='home') return <svg {...s}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
  if(tab==='scheduler') return <svg {...s}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
  if(tab==='community') return <svg {...s}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
  if(tab==='records') return <svg {...s}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;
  return null;
}

function RoleSplash({onContinue}){
  const [sel,setSel]=useState(null);
  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:'var(--bg)'}}>
      <div className="phone-scroll">
        <div style={{padding:'52px 28px 28px',textAlign:'center'}}>
          <div style={{width:56,height:56,borderRadius:16,background:'var(--t-500)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 18px',boxShadow:'0 6px 20px rgba(21,147,133,.3)'}}>
            <img src="assets/flobrain-hand.png" alt="FloLabs" style={{width:32,height:36,objectFit:'contain'}}/>
          </div>
          <div style={{font:'800 23px/1.1 var(--font)',color:'var(--ink)',marginBottom:8,letterSpacing:'-.02em'}}>FloHealth Buddy</div>
          <div style={{font:'700 15px/1.2 var(--font)',color:'var(--t-600)',marginBottom:8}}>Welcome!</div>
          <div style={{font:'400 13px/1.5 var(--font)',color:'var(--faint)',maxWidth:280,margin:'0 auto'}}>Choose the dashboard you'd like to open by default. You can switch anytime in Settings.</div>
        </div>
        <div style={{padding:'0 20px 20px',display:'flex',flexDirection:'column',gap:12}}>
          {[
            {key:'personal',title:'Personal Health',desc:'Manage medications, wellness, appointments, and daily health.'},
            {key:'coach',title:'Coach Dashboard',desc:'Manage athletes, attendance, training sessions, and team insights.'},
          ].map(o=>{
            const on=sel===o.key;
            return (
              <button key={o.key} onClick={()=>setSel(o.key)} className="card" style={{textAlign:'left',background:on?'var(--t-50)':'var(--surface)',border:on?'2px solid var(--t-400)':'1px solid var(--line)',cursor:'pointer',transition:'all .15s',padding:'16px 18px'}}>
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
                  <div style={{width:20,height:20,borderRadius:'50%',border:on?'6px solid var(--t-500)':'2px solid var(--line)',flexShrink:0,transition:'all .15s'}}/>
                  <span style={{font:'700 15px/1 var(--font)',color:'var(--ink)'}}>{o.title}</span>
                </div>
                <div style={{font:'400 12px/1.5 var(--font)',color:'var(--faint)',paddingLeft:30}}>{o.desc}</div>
              </button>
            );
          })}
        </div>
        <div style={{padding:'4px 20px 32px'}}>
          <button disabled={!sel} onClick={()=>onContinue(sel)} style={{width:'100%',background:sel?'var(--t-500)':'var(--line)',border:'none',borderRadius:12,padding:'14px',font:'700 14px/1 var(--font)',color:sel?'#fff':'var(--faint)',cursor:sel?'pointer':'default',boxShadow:sel?'0 4px 14px rgba(21,147,133,.3)':'none',transition:'all .15s'}}>Continue</button>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [activeTab,setActiveTab]=useState('home');
  const [coachTab,setCoachTab]=useState('cdash');
  const [coachSelAth,setCoachSelAth]=useState(null);
  const [mode,setMode]=useState('personal');
  const [showSplash,setShowSplash]=useState(true);
  const applyRole=(role)=>{const coach=role==='coach';setMode(coach?'athletic':'personal');setCoachTab('cdash');setActiveTab('home');try{localStorage.setItem('flo_primary_role',role);}catch(e){}setShowSplash(false);};
  React.useEffect(()=>{try{if(localStorage.getItem('flo_primary_role')==='coach')setMode('athletic');}catch(e){}},[]);
  const [menuOpen,setMenuOpen]=useState(false);
  const [profileOpen,setProfileOpen]=useState(false);
  const [addDeviceOpen,setAddDeviceOpen]=useState(false);
  const [deviceSettingsOpen,setDeviceSettingsOpen]=useState(false);
  const [aiOpen,setAiOpen]=useState(false);
  const switchMode=()=>{setMode(m=>m==='personal'?'athletic':'personal');setCoachTab('cdash');setActiveTab('home');};
  const isCoach=mode==='athletic';
  const TABS={home:<HomeTab setActiveTab={setActiveTab} onOpenMenu={()=>setMenuOpen(true)}/>,scheduler:<SchedulerTab/>,community:<CommunityTab/>,records:<RecordsTab/>};
  const COACH_TABS={cdash:<CDash onNav={(tab,ath)=>{setCoachTab(tab);if(ath!==undefined)setCoachSelAth(ath);}} onSwitch={switchMode} onOpenMenu={()=>setMenuOpen(true)}/>,cathletes:<CAths selId={coachSelAth} setSelId={setCoachSelAth}/>,ccal:<CCal/>,cstats:<CStats/>};
  const COACH_NAV=[
    {key:'cdash',label:'Home',icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>},
    {key:'cathletes',label:'Athletes',icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>},
    {key:'ccal',label:'Calendar',icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>},
    {key:'cstats',label:'Teams',icon:<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>},
  ];
  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',width:'100%',background:'#1a2e2b'}}>
      <div className="phone" style={{position:'relative'}}>
        {showSplash&&<RoleSplash onContinue={applyRole}/>}
        {!showSplash&&<>
        {menuOpen&&<div style={{position:'absolute',inset:0,zIndex:400,borderRadius:44}} onClick={()=>setMenuOpen(false)}/>}
        {profileOpen&&<UserProfileModal onClose={()=>setProfileOpen(false)}/>}
        {addDeviceOpen&&<AddDeviceModal onClose={()=>setAddDeviceOpen(false)}/>}
        {deviceSettingsOpen&&<DeviceSettingsModal onClose={()=>setDeviceSettingsOpen(false)}/>}
        {menuOpen&&<DeviceMenu onClose={()=>setMenuOpen(false)} onSwitch={switchMode} mode={mode} onOpenProfile={()=>setProfileOpen(true)} onOpenAddDevice={()=>setAddDeviceOpen(true)} onOpenDeviceSettings={()=>setDeviceSettingsOpen(true)}/>}
        <div className="phone-scroll">
          {isCoach?(COACH_TABS[coachTab]||<CDash onNav={setCoachTab}/>):(TABS[activeTab])}
        </div>
        <button onClick={()=>setAiOpen(true)} style={{position:'absolute',bottom:80,right:14,zIndex:200,background:'var(--t-500)',border:'none',borderRadius:999,padding:'10px 16px',font:'700 12px/1 var(--font)',color:'#fff',cursor:'pointer',boxShadow:'0 4px 16px rgba(21,147,133,.35)',display:'flex',alignItems:'center',gap:6}}>
          🤖 {isCoach?'Coach AI':'Health AI'}
        </button>
        {aiOpen&&<HealthAIPanel onClose={()=>setAiOpen(false)} mode={isCoach?'coach':'health'}/>}
        <div className="bottom-nav">
          {isCoach?COACH_NAV.map(t=>(<button key={t.key} className={'nav-item'+(coachTab===t.key?' on':'')} onClick={()=>setCoachTab(t.key)}><div className="nav-item-icon">{t.icon}</div><span className="nav-item-label">{t.label}</span></button>)):['home','scheduler','community','records'].map(tab=>(<button key={tab} className={'nav-item'+(activeTab===tab?' on':'')} onClick={()=>setActiveTab(tab)}><div className="nav-item-icon"><NavIcon tab={tab}/></div><span className="nav-item-label">{tab.charAt(0).toUpperCase()+tab.slice(1)}</span></button>))}
        </div>
        </>}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
