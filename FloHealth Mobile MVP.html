<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --t-50:#f0fdf9;--t-100:#ccfbef;--t-200:#99f6e0;
  --t-300:#4dd9c0;--t-400:#2DD4BF;--t-500:#159385;--t-600:#0c3d37;
  --bg:#eef4f2;--surface:#fff;--line:#e4ebe9;
  --ink:#1a1f2e;--faint:#7a8899;--font:'Inter',system-ui,sans-serif;
}
html,body{width:100%;min-height:100%;background:#1a2e2b;font-family:var(--font)}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
#root{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%}

/* phone shell */
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;
  box-shadow:0 40px 100px rgba(0,0,0,.5),0 0 0 12px #111,0 0 0 14px #333;
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  transform-origin:top center;
  scale:min(1, calc((100vh - 40px) / 844px), calc((100vw - 40px) / 390px))}
.phone-scroll{flex:1;overflow-y:auto;padding-bottom:70px}
.phone-scroll::-webkit-scrollbar{display:none}

/* app header */
.app-header{background:var(--surface);border-bottom:1px solid var(--line);
  padding:14px 16px 12px;flex-shrink:0}
.app-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.app-eyebrow{font:700 10px/1 var(--font);letter-spacing:1.2px;text-transform:uppercase;color:var(--t-500)}
.app-greeting{font:700 18px/1.2 var(--font);color:var(--ink)}
.app-date{font:400 12px/1 var(--font);color:var(--faint);margin-top:2px}

/* bottom nav */
.bottom-nav{position:absolute;bottom:0;left:0;right:0;height:68px;
  background:var(--t-500);border-top:none;
  display:flex;align-items:center;justify-content:space-around;padding:0 4px 8px;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;
  background:none;border:none;padding:8px 4px 4px;cursor:pointer;color:rgba(255,255,255,.55);transition:color .14s}
.nav-item.on{color:#fff}
.nav-item-icon{font-size:20px;line-height:1}
.nav-item-label{font:500 10px/1 var(--font);letter-spacing:.3px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  margin:0 12px 12px;padding:16px;overflow:hidden}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font:700 15px/1 var(--font);color:var(--ink)}
.card-link{font:500 12px/1 var(--font);color:var(--t-500);background:none;border:none;cursor:pointer}

/* medications */
.med-count{font:700 28px/1 var(--font);color:var(--ink)}
.med-count span{font:400 13px/1 var(--font);color:var(--faint);margin-left:6px}
.med-bar-track{background:var(--line);border-radius:99px;height:5px;margin:8px 0 12px}
.med-bar-fill{background:var(--t-400);border-radius:99px;height:100%;transition:width .4s}
.med-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.med-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.med-check.done{background:var(--t-500);border-color:var(--t-500);color:#fff}
.med-time{font:500 12px/1 var(--font);color:var(--faint);width:52px;flex-shrink:0}
.med-name{font:400 13px/1 var(--font);color:var(--ink);flex:1}

/* goals */
.goal-item{padding:9px 0;border-top:1px solid var(--line)}
.day-row{display:flex;gap:5px;align-items:center;margin:6px 0 4px}
.day-label{font:400 10px/1 var(--font);color:var(--faint);width:20px;text-align:center}
.day-cell{width:28px;height:28px;border-radius:7px;background:var(--line);border:none;
  cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center}
.day-cell.done{background:var(--t-400)}

/* motivation */
.mot-eyebrow{font:600 10px/1 var(--font);color:var(--t-500);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px}
.mot-quote{font:500 14px/1.6 var(--font);color:var(--ink);font-style:italic;margin-bottom:10px}
.mot-tip{display:flex;align-items:flex-start;gap:8px;background:var(--t-50);border-radius:10px;padding:10px}
.mot-tip-text{font:400 13px/1.5 var(--font);color:var(--ink)}
.mot-dots{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.mot-dot{width:7px;height:7px;border-radius:50%;background:var(--line);border:none;cursor:pointer}
.mot-dot.on{background:var(--t-400)}
.mot-arrow{background:none;border:none;cursor:pointer;color:var(--faint);font-size:16px}

/* community */
.ev-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px}
.ev-cat-pill{font:700 10px/1 var(--font);padding:3px 9px;border-radius:999px;width:fit-content;text-transform:uppercase;letter-spacing:.4px}
.ev-title{font:700 14px/1.3 var(--font);color:var(--ink)}
.ev-meta{font:400 12px/1 var(--font);color:var(--faint)}
.pill-tabs{display:flex;background:var(--line);border-radius:11px;padding:3px;gap:3px}
.pill-tab{flex:1;padding:9px 0;border:none;border-radius:9px;font:600 13px/1 var(--font);
  cursor:pointer;background:none;color:var(--faint);transition:all .14s}
.pill-tab.on{background:var(--t-500);color:#fff}
.chip{padding:7px 0;border-radius:999px;border:1px solid var(--line);width:calc(20% - 5px);flex-shrink:0;
  background:var(--surface);color:var(--ink);font:500 12px/1 var(--font);cursor:pointer;transition:all .12s;text-align:center}
.chip.on{background:var(--t-500);border-color:var(--t-500);color:#fff}

/* section toggle */
.sec-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;
  background:none;border:none;cursor:pointer;padding:0;text-align:left}
.chevron{transition:transform .2s;color:var(--faint)}
.chevron.open{transform:rotate(180deg)}

/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{text-align:center;padding:6px 0;border:none;border-radius:8px;cursor:pointer;
  font:400 12px/1 var(--font);color:var(--ink);background:none;position:relative;transition:all .12s}
.cal-cell.today{background:var(--t-500);color:#fff;font-weight:700}
.cal-cell.sel{background:var(--t-50);font-weight:600;color:var(--t-600)}
.cal-cell.has-appt::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--t-400);display:block}

/* records */
.rec-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);
  cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;transition:background .14s}
.rec-row:hover{background:var(--t-50)}
.rec-icon{width:38px;height:38px;border-radius:10px;background:var(--t-50);border:1.5px solid var(--t-200);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rec-lbl{font:600 14px/1 var(--font);color:var(--ink)}
.rec-sub{font:400 12px/1 var(--font);color:var(--faint);margin-top:2px}
.rec-detail{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.rec-detail-row{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.rec-detail-row:last-child{border-bottom:none}

/* status pills */
.status-pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;flex-shrink:0}
.appt-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.appt-icon{width:40px;height:40px;border-radius:11px;background:var(--t-50);
  border:1.5px solid var(--t-200);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.appt-title{font:700 13px/1.2 var(--font);color:var(--ink);margin-bottom:2px}
.appt-sub{font:400 11px/1 var(--font);color:var(--faint);margin-bottom:2px}
.appt-time-txt{font:600 11px/1 var(--font);color:var(--t-500)}

/* 3-dot menu button */
.app-menu-btn{background:none;border:none;cursor:pointer;display:flex;gap:3px;align-items:center;padding:6px;border-radius:8px;transition:background .12s}
.app-menu-btn:hover{background:var(--t-50)}
.app-menu-dot{width:4px;height:4px;border-radius:50%;background:var(--faint);display:block}

/* wellness goals */
.goal-banner{background:var(--t-50);border:1px solid var(--t-100);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.goal-banner-label{font:700 10px/1 var(--font);color:var(--t-500);letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.goal-banner-title{font:700 16px/1 var(--font);color:var(--ink);margin-bottom:3px}
.goal-banner-sub{font:400 12px/1 var(--font);color:var(--faint)}
.goal-habit-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.goal-habit-label{font:400 13px/1.4 var(--font);color:var(--ink);flex:1}
.goal-habit-label span{color:var(--t-500);font-weight:600}
.goal-habit-progress{font:600 12px/1 var(--font);color:var(--t-500);margin-right:8px}
.goal-ai-row{display:flex;align-items:center;gap:6px;padding:12px 14px;background:var(--bg);border-radius:12px;margin-top:4px;margin-bottom:10px}
.goal-ai-tag{font:400 12px/1 var(--font);color:var(--faint);flex:1}
.goal-ai-badge{background:var(--t-500);color:#fff;font:700 12px/1 var(--font);padding:5px 12px;border-radius:999px;cursor:pointer}
.goal-add{width:100%;padding:13px;border:1.5px dashed var(--t-300);border-radius:12px;background:none;font:500 13px/1 var(--font);color:var(--faint);cursor:pointer;text-align:center}
.goal-add:hover{background:var(--t-50)}

@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes dot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
</style>
</head>

    return base.map(d=>({...d,players:pPlayers?(pPlayers+' players'):d.players}));
  };
  const endRef = React.useRef(null);

  const QUICK = isCoach
    ? ["Recovery tips for hamstring strain", "Pre-game warm-up routine", "How to improve 40-yard dash", "Managing athlete burnout"]
    : ["What is Lisinopril used for?", "Side effects of Metformin", "What is an A1C test?", "Explain my blood pressure reading"];

  const COACH_REPLIES = {

      const t = text.toLowerCase();
      if (t.includes('lisinopril')) return "Lisinopril is an ACE inhibitor used to treat high blood pressure and heart failure.";
      if (t.includes('metformin')) return "Common Metformin side effects include nausea, diarrhea, and stomach upset.";
      if (t.includes('a1c')) return "An A1C test measures your average blood sugar over 2–3 months. Normal is below 5.7%.";

      return "That's a great health question. Based on your profile, I'd recommend discussing this with Dr. Liam Chen at your next visit on Jul 8.";

    const t = text.toLowerCase();
    if (t.includes('hamstring') || t.includes('recovery') || t.includes('strain')) return COACH_REPLIES.hamstring;

    if (t.includes('burnout') || t.includes('motivation') || t.includes('fatigue')) return COACH_REPLIES.burnout;

              <div style={{font:'700 10px/1 var(--font)',color:'var(--t-600)',letterSpacing:'.6px',textTransform:'uppercase'}}>Recommended Drills</div>
              <button onClick={()=>{setDrills(null);setOpenDrill(null);}} style={{background:'none',border:'none',font:'700 9px/1 var(--font)',color:'var(--faint)',cursor:'pointer',padding:'2px 4px'}}>Clear</button>
            </div>
            <div style={{font:'400 10px/1.3 var(--font)',color:'var(--faint)',marginBottom:8}}>{drills.focus}{drills.sport?' · '+drills.sport:''}{drills.age?' · '+drills.age:''}</div>

              {drills.list.map((d,i)=>(

                      <span style={{fontSize:15}}>{d.icon}</span>
                      <span style={{font:'700 12px/1.2 var(--font)',color:'var(--ink)'}}>{d.name}</span>
                    </div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
                      {[['Focus',d.focus],['Time',d.time],['Players',d.players]].map(([k,v])=>(

                      ))}
                    </div>
                  </div>
                  <button onClick={()=>setOpenDrill(openDrill===i?null:i)} style={{width:'100%',textAlign:'left',background:'var(--t-50)',border:'none',borderTop:'1px solid var(--t-200)',padding:'8px 11px',font:'700 10px/1 var(--font)',color:'var(--t-600)',cursor:'pointer',display:'flex',alignItems:'center',gap:5}}>
                    <span style={{display:'inline-block',transform:openDrill===i?'rotate(90deg)':'none',transition:'transform .18s'}}>▶</span>
                    {openDrill===i?'Hide Instructions':'View Instructions'}
                  </button>
                  {openDrill===i&&<ol style={{margin:0,padding:'9px 11px 11px 26px',display:'flex',flexDirection:'column',gap:5}}>
                    {d.steps.map((s,si)=>(<li key={si} style={{font:'400 11px/1.45 var(--font)',color:'var(--ink)'}}>{s}</li>))}
                  </ol>}
                </div>
              ))}
            </div>
          </div>}
        </div>}
        {/* Quick prompts */}
        <div style={{display:'flex',gap:6,padding:'8px 14px',overflowX:'auto',borderTop:'1px solid var(--line)'}}>
          {QUICK.map((q,i)=>(
            <button key={i} onClick={()=>send(q)} style={{whiteSpace:'nowrap',background:'var(--t-50)',border:'1px solid var(--t-200)',borderRadius:999,padding:'6px 12px',font:'500 11px/1 var(--font)',color:'var(--t-600)',cursor:'pointer',flexShrink:0}}>{q}</button>
          ))}
        </div>
        {/* Input */}
        <div style={{display:'flex',gap:8,padding:'10px 14px 20px',borderTop:'1px solid var(--line)'}}>
          <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&send(input)}
            placeholder="Ask about medications, symptoms…"
            style={{flex:1,border:'1px solid var(--line)',borderRadius:10,padding:'10px 12px',font:'400 13px/1 var(--font)',color:'var(--ink)',background:'var(--bg)',outline:'none'}}/>
          <button onClick={()=>send(input)} style={{background:'var(--t-500)',border:'none',borderRadius:10,width:40,height:40,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>
  );
}

function LibrarySearch(){
  const [query,setQuery]=useState('');
  const [log,setLog]=useState([]);
  const [added,setAdded]=useState(null);
  const results=query.length>1?FOOD_DB.filter(f=>f.name.toLowerCase().includes(query.toLowerCase())):[];
  const addFood=(f)=>{
    setLog(l=>[...l,f]);
    setAdded(f.name);
    setQuery('');
    setTimeout(()=>setAdded(null),1500);
  };
  const totalCal=log.reduce((s,f)=>s+f.cal,0);
  return(<div style={{marginBottom:12}}>
    <div style={{position:'relative',marginBottom:8}}>
      <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search food to log calories…"
        style={{width:'100%',background:'var(--bg)',border:'1px solid var(--line)',borderRadius:10,padding:'9px 12px 9px 34px',font:'400 13px/1 var(--font)',color:'var(--ink)',outline:'none'}}/>
      <svg style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>
    {results.length>0&&<div style={{background:'var(--surface)',border:'1px solid var(--line)',borderRadius:10,marginBottom:8,overflow:'hidden'}}>
      {results.map((f,i)=>(
        <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'9px 12px',borderTop:i>0?'1px solid var(--line)':'none'}}>
          <div>
            <div style={{font:'600 13px/1 var(--font)',color:'var(--ink)'}}>{f.name}</div>
            <div style={{font:'400 11px/1 var(--font)',color:'var(--faint)',marginTop:2}}>{f.serving} · {f.cal} cal</div>
          </div>
          <button onClick={()=>addFood(f)} style={{background:'var(--t-500)',border:'none',borderRadius:8,padding:'5px 12px',font:'600 11px/1 var(--font)',color:'#fff',cursor:'pointer'}}>+ Log</button>
        </div>
      ))}
    </div>}
    {added&&<div style={{background:'var(--t-50)',border:'1px solid var(--t-100)',borderRadius:8,padding:'7px 12px',font:'500 12px/1 var(--font)',color:'var(--t-600)',marginBottom:8}}>✓ {added} logged!</div>}
    {log.length>0&&<div style={{background:'var(--bg)',borderRadius:10,padding:'10px 12px',marginBottom:4}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <span style={{font:'700 11px/1 var(--font)',color:'var(--faint)',letterSpacing:'.6px',textTransform:'uppercase'}}>Today's Log</span>
        <span style={{font:'700 13px/1 var(--font)',color:'var(--t-500)'}}>{totalCal} cal</span>
      </div>
      {log.map((f,i)=>(
        <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',borderTop:i>0?'1px solid var(--line)':'none'}}>
          <span style={{font:'400 12px/1 var(--font)',color:'var(--ink)'}}>{f.name}</span>
          <span style={{font:'500 12px/1 var(--font)',color:'var(--faint)'}}>{f.cal} cal</span>
        </div>
      ))}
    </div>}
  </div>);
}

              </div>

          </>}
        </div>
      </div>}
    </div>
  );

          </button>
        </div>

        {REC_CATS.map(cat=>(
          <div key={cat.key} className="card" style={{padding:0,overflow:'hidden'}}>
            <button onClick={()=>setExpanded(expanded===cat.key?null:cat.key)}

              <div className="rec-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--t-500)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
              <div style={{flex:1}}>
                <div className="rec-lbl">{cat.label}</div>
                <div className="rec-sub">{cat.count} records · Last: {cat.last}</div>
              </div>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{transform:expanded===cat.key?'rotate(90deg)':'none',transition:'transform .2s',flexShrink:0}}><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            {expanded===cat.key && cat.items.length>0 && (
              <div style={{borderTop:'1px solid var(--line)'}}>
                {cat.items.map((item,i)=>(
                  <div key={i} style={{padding:'11px 16px',borderTop:i>0?'1px solid var(--line)':'none'}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                      <span style={{font:'600 13px/1 var(--font)',color:'var(--ink)'}}>{item.title}</span>
                      <span style={{font:'700 12px/1 var(--font)',color:'var(--t-500)'}}>{item.result}</span>
                    </div>
                    <div style={{font:'400 11px/1 var(--font)',color:'var(--faint)',marginBottom:3}}>{item.date}</div>
                    <div style={{font:'400 12px/1.4 var(--font)',color:'var(--ink)'}}>{item.note}</div>
                  </div>
                ))}
              </div>
            )}
            {expanded===cat.key && cat.items.length===0 && (
              <div style={{padding:'12px 16px',borderTop:'1px solid var(--line)',font:'400 13px/1 var(--font)',color:'var(--faint)',textAlign:'center'}}>No records to display</div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

      'Double Play Depth':[{x:.5,y:.52,label:'P'},{x:.5,y:.88,label:'C'},{x:.36,y:.73,label:'1B'},{x:.47,y:.66,label:'2B'},{x:.60,y:.68,label:'SS'},{x:.65,y:.56,label:'3B'},{x:.2,y:.38,label:'LF'},{x:.5,y:.25,label:'CF'},{x:.8,y:.38,label:'RF'}],

function FieldDiagram({type,athletes}){
  const W=330,H=180;
  const dots=athletes?athletes.slice(0,11):[];
  const POSITIONS={
    football:[
      {x:.30,y:.5,label:'QB'},{x:.24,y:.5,label:'RB'},{x:.26,y:.62,label:'FB'},
      {x:.38,y:.32,label:'LT'},{x:.38,y:.41,label:'LG'},{x:.38,y:.5,label:'C'},{x:.38,y:.59,label:'RG'},{x:.38,y:.68,label:'RT'},
      {x:.38,y:.78,label:'TE'},{x:.38,y:.14,label:'WR'},{x:.38,y:.90,label:'WR'}
    ],
    baseball:[
      {x:.5,y:.52,label:'P'},{x:.5,y:.88,label:'C'},{x:.35,y:.72,label:'1B'},{x:.5,y:.62,label:'2B'},
      {x:.65,y:.72,label:'SS'},{x:.65,y:.55,label:'3B'},{x:.2,y:.38,label:'LF'},{x:.5,y:.25,label:'CF'},{x:.8,y:.38,label:'RF'}
    ],
    field:[
      {x:.06,y:.5,label:'GK'},{x:.18,y:.18,label:'LB'},{x:.15,y:.4,label:'CB'},{x:.15,y:.6,label:'CB'},{x:.18,y:.82,label:'RB'},
      {x:.32,y:.2,label:'LM'},{x:.3,y:.42,label:'CM'},{x:.3,y:.58,label:'CM'},{x:.32,y:.8,label:'RM'},
      {x:.44,y:.38,label:'ST'},{x:.44,y:.62,label:'ST'}
    ],
    court:[
      {x:.30,y:.5,label:'PG'},{x:.22,y:.20,label:'SG'},{x:.22,y:.80,label:'SF'},
      {x:.13,y:.34,label:'PF'},{x:.12,y:.66,label:'C'}
    ],
    rink:[
      {x:.5,y:.08,label:'G'},{x:.25,y:.3,label:'LD'},{x:.75,y:.3,label:'RD'},
      {x:.3,y:.6,label:'LW'},{x:.5,y:.65,label:'C'},{x:.7,y:.6,label:'RW'}
    ],
    track:[
      {x:.15,y:.5,label:'1'},{x:.3,y:.5,label:'2'},{x:.45,y:.5,label:'3'},
      {x:.6,y:.5,label:'4'},{x:.75,y:.5,label:'5'},{x:.9,y:.5,label:'6'}
    ],
    pool:[
      {x:.12,y:.5,label:'L1'},{x:.25,y:.5,label:'L2'},{x:.38,y:.5,label:'L3'},
      {x:.5,y:.5,label:'L4'},{x:.62,y:.5,label:'L5'},{x:.75,y:.5,label:'L6'},{x:.88,y:.5,label:'L7'}
    ],
  };

  /* Opponent formations. Soccer ('field') mirrors the home shape; the others get
     sport-correct opposing units — football defense across the LOS, baseball's
     batting team, basketball defenders in the far half. */
  const AWAY={
    football:[
      {x:.46,y:.35,label:'DE'},{x:.46,y:.44,label:'DT'},{x:.46,y:.56,label:'DT'},{x:.46,y:.65,label:'DE'},
      {x:.55,y:.30,label:'LB'},{x:.55,y:.5,label:'LB'},{x:.55,y:.70,label:'LB'},
      {x:.50,y:.12,label:'CB'},{x:.50,y:.90,label:'CB'},
      {x:.68,y:.34,label:'S'},{x:.68,y:.66,label:'S'}
    ],
    baseball:[
      {x:.44,y:.92,label:'B'},{x:.31,y:.75,label:'R1'},{x:.47,y:.59,label:'R2'},{x:.68,y:.75,label:'R3'}
    ],
    court:[
      {x:.70,y:.5,label:'PG'},{x:.78,y:.20,label:'SG'},{x:.78,y:.80,label:'SF'},
      {x:.87,y:.34,label:'PF'},{x:.88,y:.66,label:'C'}
    ],
  };

  const BG={field:'#2d5a27',court:'#c17f3b',rink:'#bcd8f1',track:'#c8956c',pool:'#1a7ab5'};
  const LINE={field:'#ffffff',court:'#ffffff',rink:'#cc0000',track:'#ffffff',pool:'#ffffff'};
  const bg=BG[type]||'#2d5a27', lc=LINE[type]||'#fff';
  const pos=POSITIONS[type]||POSITIONS.field;

  const FieldShape=()=>{
    if(type==='field') return <>
      <rect x={1} y={1} width={W-2} height={H-2} rx={4} fill={bg} stroke={lc} strokeWidth={1.5}/>
      <line x1={W/2} y1={1} x2={W/2} y2={H-1} stroke={lc} strokeWidth={1} strokeDasharray="4 4"/>
      <circle cx={W/2} cy={H/2} r={22} fill="none" stroke={lc} strokeWidth={1}/>
      <rect x={1} y={H/2-18} width={28} height={36} fill="none" stroke={lc} strokeWidth={1}/>
      <rect x={W-29} y={H/2-18} width={28} height={36} fill="none" stroke={lc} strokeWidth={1}/>
    </>;
    if(type==='court') return <>
      <rect x={1} y={1} width={W-2} height={H-2} rx={4} fill={bg} stroke={lc} strokeWidth={1.5}/>
      <line x1={W/2} y1={1} x2={W/2} y2={H-1} stroke={lc} strokeWidth={1}/>
      <circle cx={W/2} cy={H/2} r={18} fill="none" stroke={lc} strokeWidth={1}/>
      <rect x={1} y={H/2-22} width={50} height={44} fill="none" stroke={lc} strokeWidth={1}/>
      <rect x={W-51} y={H/2-22} width={50} height={44} fill="none" stroke={lc} strokeWidth={1}/>
      <path d={`M ${51} ${H/2-22} A 22 22 0 0 1 51 ${H/2+22}`} fill="none" stroke={lc} strokeWidth={1}/>
      <path d={`M ${W-51} ${H/2-22} A 22 22 0 0 0 ${W-51} ${H/2+22}`} fill="none" stroke={lc} strokeWidth={1}/>
    </>;
    if(type==='football') return <>
      <rect x={1} y={1} width={W-2} height={H-2} rx={4} fill="#2d5a27" stroke="#fff" strokeWidth={1.5}/>
      <rect x={1} y={1} width={(W-2)/10} height={H-2} fill="rgba(255,255,100,.15)"/>
      <rect x={W-1-(W-2)/10} y={1} width={(W-2)/10} height={H-2} fill="rgba(255,255,100,.15)"/>
      {[1,2,3,4,5,6,7,8,9].map(i=><line key={i} x1={1+i*(W-2)/10} y1={8} x2={1+i*(W-2)/10} y2={H-8} stroke="rgba(255,255,255,.35)" strokeWidth={.8}/>)}
      <line x1={(W-2)/10+1} y1={1} x2={(W-2)/10+1} y2={H-1} stroke="rgba(255,255,255,.6)" strokeWidth={1}/>
      <line x1={W-1-(W-2)/10} y1={1} x2={W-1-(W-2)/10} y2={H-1} stroke="rgba(255,255,255,.6)" strokeWidth={1}/>
      <text x={(W-2)/20+1} y={H/2+4} textAnchor="middle" fill="rgba(255,255,255,.5)" fontSize={7} fontFamily="system-ui" fontWeight="700">END</text>
      <text x={W-1-(W-2)/20} y={H/2+4} textAnchor="middle" fill="rgba(255,255,255,.5)" fontSize={7} fontFamily="system-ui" fontWeight="700">END</text>
    </>;
    if(type==='baseball') return <>
      <rect x={1} y={1} width={W-2} height={H-2} rx={4} fill="#4a7c3f" stroke="#fff" strokeWidth={1.5}/>
      <path d={`M ${W*0.15} ${H-10} L ${W/2} ${H*0.12} L ${W*0.85} ${H-10} Z`} fill="#b5824a" stroke="#fff" strokeWidth={1}/>
      <circle cx={W/2} cy={H*0.52} r={5} fill="#fff"/>
      <circle cx={W*0.35} cy={H*0.72} r={5} fill="#fff"/>
      <circle cx={W*0.65} cy={H*0.72} r={5} fill="#fff"/>
      <circle cx={W/2} cy={H*0.12} r={5} fill="#fff"/>
      <path d={`M ${W*0.12} ${H-8} A ${W*0.76} ${H*0.76} 0 0 1 ${W*0.88} ${H-8}`} fill="none" stroke="rgba(255,255,255,.3)" strokeWidth={1}/>
    </>; return <>
      <rect x={1} y={1} width={W-2} height={H-2} rx={28} fill={bg} stroke={lc} strokeWidth={1.5}/>
      <line x1={W/2} y1={8} x2={W/2} y2={H-8} stroke={lc} strokeWidth={2}/>
      <circle cx={W/2} cy={H/2} r={16} fill="none" stroke={lc} strokeWidth={1}/>
      <circle cx={80} cy={H/2} r={16} fill="none" stroke={lc} strokeWidth={1}/>
      <circle cx={W-80} cy={H/2} r={16} fill="none" stroke={lc} strokeWidth={1}/>
      <line x1={W*0.22} y1={8} x2={W*0.22} y2={H-8} stroke={'#0000cc'} strokeWidth={1} strokeDasharray="3 3"/>
      <line x1={W*0.78} y1={8} x2={W*0.78} y2={H-8} stroke={'#0000cc'} strokeWidth={1} strokeDasharray="3 3"/>
    </>;
    if(type==='track') return <>
      <ellipse cx={W/2} cy={H/2} rx={W/2-2} ry={H/2-2} fill={bg} stroke={lc} strokeWidth={1.5}/>
      <ellipse cx={W/2} cy={H/2} rx={W/2-24} ry={H/2-24} fill="#8a6040" stroke={lc} strokeWidth={1}/>
      {[1,2,3,4,5,6,7].map(i=><ellipse key={i} cx={W/2} cy={H/2} rx={W/2-2-i*11} ry={H/2-2-i*11} fill="none" stroke={lc} strokeWidth={.5} strokeDasharray="4 4"/>)}
    </>;
    if(type==='pool') return <>
      <rect x={1} y={1} width={W-2} height={H-2} rx={4} fill={bg} stroke={lc} strokeWidth={1.5}/>
      {[1,2,3,4,5,6].map(i=><line key={i} x1={1+i*(W-2)/7} y1={8} x2={1+i*(W-2)/7} y2={H-8} stroke={'rgba(255,255,255,.4)'} strokeWidth={1}/>)}
      <line x1={1} y1={14} x2={W-1} y2={14} stroke={lc} strokeWidth={1}/>
      <line x1={1} y1={H-14} x2={W-1} y2={H-14} stroke={lc} strokeWidth={1}/>
    </>;
    return null;
  };

  const showAway=['field','football','baseball','court'].includes(type);
  const homeForm=pos, awayForm=AWAY[type]||pos.map(p=>({...p,x:1-p.x}));
  const buildNodes=()=>{
    const home=homeForm.map((p,i)=>({x:p.x,y:p.y,team:'home',pos:p.label,init:(dots[i]&&dots[i].init)||p.label}));
    if(!showAway) return home;
    const away=awayForm.map(p=>({x:p.x,y:p.y,team:'away',pos:p.label,init:p.label}));
    return [...home,...away];
  };
  const [nodes,setNodes]=React.useState(buildNodes);
  const [dragIdx,setDragIdx]=React.useState(null);
  const [editIdx,setEditIdx]=React.useState(null);
  const SWATCHES=['#159385','#2563eb','#d1495b','#e08a1e','#7c3aed','#475569'];
  const [homeColor,setHomeColor]=React.useState('#159385');
  const [awayColor,setAwayColor]=React.useState('#d1495b');
  /* Formation presets — selecting one snaps that unit into place, keeping any
     athlete initials the coach already assigned. 'Custom' leaves dots as-is. */
  const FSETS=FORMATIONS[type]||{};
  const FLABELS=UNIT_LABELS[type]||{};
  const [offForm,setOffForm]=React.useState('');
  const [defForm,setDefForm]=React.useState('');
  const applyForm=(unit,name)=>{
    if(unit==='off') setOffForm(name); else setDefForm(name);
    if(!name||name==='Custom') return;
    const arr=(FSETS[unit]||{})[name];
    if(!arr) return;
    const team=unit==='off'?'home':'away';
    setNodes(prev=>{
      const others=prev.filter(n=>n.team!==team);
      const mine=prev.filter(n=>n.team===team);
      const next=arr.map((p,i)=>({
        x:p.x,y:p.y,team,pos:p.label,
        init:(mine[i]&&mine[i].init&&mine[i].init!==mine[i].pos)?mine[i].init:p.label
      }));
      return team==='home'?[...next,...others]:[...others,...next];
    });
    setEditIdx(null);
  };
  React.useEffect(()=>{setOffForm('');setDefForm('');},[type]);
  /* Recorded plays — the exact player/position layout captured at a game
     timestamp. Scoring stats live on the score sheet; this records WHO was
     WHERE and WHEN, which is what Coach AI correlates for insights. */
  const PLAY_KEY='flo_plays_'+type;
  const PER={
    football:['Q1','Q2','Q3','Q4','OT'],
    court:['Q1','Q2','Q3','Q4','OT'],
    baseball:['Inn 1','Inn 2','Inn 3','Inn 4','Inn 5','Inn 6','Inn 7','Inn 8','Inn 9'],
    field:['1st Half','2nd Half','Extra Time'],
  };
  const RESULT=['—','Scored','Stopped','Turnover','Penalty','Big Gain'];
  const perList=PER[type]||['P1','P2','P3'];
  const [plays,setPlays]=React.useState([]);
  const [saveOpen,setSaveOpen]=React.useState(false);
  const [listOpen,setListOpen]=React.useState(false);
  const [expanded,setExpanded]=React.useState(null);
  const [period,setPeriod]=React.useState(perList[0]);
  const [clock,setClock]=React.useState('');
  const [result,setResult]=React.useState(RESULT[0]);
  React.useEffect(()=>{
    try{setPlays(JSON.parse(localStorage.getItem(PLAY_KEY)||'[]'));}catch(e){setPlays([]);}
    setPeriod((PER[type]||['P1'])[0]);
    setSaveOpen(false); setClock(''); setResult(RESULT[0]); setExpanded(null);
  },[type]);
  const onClock=(v)=>{const d=v.replace(/[^0-9]/g,'').slice(0,4);setClock(d.length>2?d.slice(0,d.length-2)+':'+d.slice(-2):d);};
  const persistPlays=(list)=>{setPlays(list);try{localStorage.setItem(PLAY_KEY,JSON.stringify(list));}catch(e){}};
  const savePlay=()=>{
    const rec={id:Date.now(),
      period,clock:clock.trim(),result:result===RESULT[0]?'':result,off:offForm,def:defForm,
      ts:new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}),
      nodes:nodes.map(n=>({...n})),homeColor,awayColor};
    persistPlays([rec,...plays].slice(0,30));
    setClock(''); setResult(RESULT[0]); setSaveOpen(false); setListOpen(true);
  };
  const loadPlay=(p)=>{setNodes(p.nodes.map(n=>({...n})));if(p.homeColor)setHomeColor(p.homeColor);if(p.awayColor)setAwayColor(p.awayColor);setEditIdx(null);};
  const svgRef=React.useRef(null);
  const movedRef=React.useRef(false);
  React.useEffect(()=>{ setNodes(buildNodes()); setEditIdx(null); },[type]);

  const getSVGCoords=(e)=>{
    const svg=svgRef.current;
    if(!svg) return {x:0,y:0};
    const rect=svg.getBoundingClientRect();
    const clientX=e.touches?e.touches[0].clientX:e.clientX;
    const clientY=e.touches?e.touches[0].clientY:e.clientY;
    return{
      x:Math.max(8,Math.min(W-8,(clientX-rect.left)/rect.width*W)),
      y:Math.max(8,Math.min(H-8,(clientY-rect.top)/rect.height*H))
    };
  };

  const onPointerDown=(i,e)=>{
    e.preventDefault();
    setDragIdx(i);
    movedRef.current=false;
    const start=getSVGCoords(e);
    const move=(ev)=>{
      const {x,y}=getSVGCoords(ev);
      if(Math.abs(x-start.x)>3||Math.abs(y-start.y)>3) movedRef.current=true;
      setNodes(d=>{const n=[...d];n[i]={...n[i],x:x/W,y:y/H};return n;});
    };
    const up=()=>{ setDragIdx(null); if(!movedRef.current) setEditIdx(i); window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); window.removeEventListener('touchmove',move); window.removeEventListener('touchend',up); };
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up);
    window.addEventListener('touchmove',move,{passive:false});
    window.addEventListener('touchend',up);
  };

  const ColorRow=({label,val,set})=>(
    <div style={{display:'flex',alignItems:'center',gap:6}}>
      <span style={{font:'700 8px/1 var(--font)',color:'var(--faint)',letterSpacing:'.4px',width:38,textTransform:'uppercase'}}>{label}</span>
      <div style={{display:'flex',gap:4}}>{SWATCHES.map(c=>(
        <button key={c} onClick={()=>set(c)} style={{width:16,height:16,borderRadius:'50%',background:c,border:val===c?'2px solid var(--ink)':'2px solid #fff',boxShadow:'0 0 0 1px var(--line)',cursor:'pointer',padding:0}}/>
      ))}</div>
    </div>
  );

  return(
    <div>
      <div style={{display:'flex',flexDirection:'column',gap:5,marginBottom:6}}>
        <ColorRow label="Home" val={homeColor} set={setHomeColor}/>
        {showAway&&<ColorRow label="Away" val={awayColor} set={setAwayColor}/>}
      </div>
      {FSETS.off&&<div style={{display:'grid',gridTemplateColumns:FSETS.def?'1fr 1fr':'1fr',gap:6,marginBottom:7}}>
        <div>
          <label style={{font:'700 8px/1 var(--font)',color:'var(--faint)',letterSpacing:'.4px',textTransform:'uppercase',display:'block',marginBottom:3}}>{FLABELS.off||'Formation'}</label>
          <select value={offForm} onChange={e=>applyForm('off',e.target.value)} style={{width:'100%',font:'600 10px/1 var(--font)',color:'var(--ink)',border:'1px solid var(--t-400)',borderRadius:7,padding:'7px 5px',background:'var(--surface)',outline:'none',boxSizing:'border-box'}}>
            <option value="">Select…</option>
            {Object.keys(FSETS.off).map(o=><option key={o} value={o}>{o}</option>)}
            <option value="Custom">Custom</option>
          </select>
        </div>
        {FSETS.def&&<div>
          <label style={{font:'700 8px/1 var(--font)',color:'var(--faint)',letterSpacing:'.4px',textTransform:'uppercase',display:'block',marginBottom:3}}>{FLABELS.def||'Defense'}</label>
          <select value={defForm} onChange={e=>applyForm('def',e.target.value)} style={{width:'100%',font:'600 10px/1 var(--font)',color:'var(--ink)',border:'1px solid var(--t-400)',borderRadius:7,padding:'7px 5px',background:'var(--surface)',outline:'none',boxSizing:'border-box'}}>
            <option value="">Select…</option>
            {Object.keys(FSETS.def).map(o=><option key={o} value={o}>{o}</option>)}
            <option value="Custom">Custom</option>
          </select>
        </div>}
      </div>}
      <div style={{position:'relative'}}>
        <svg ref={svgRef} width="100%" viewBox={`0 0 ${W} ${H}`} style={{borderRadius:8,display:'block',touchAction:'none'}}>
          <FieldShape/>
          {nodes.map((p,i)=>{
            const cx=p.x*W, cy=p.y*H;
            const col=p.team==='away'?awayColor:homeColor;
            return(
              <g key={i} onPointerDown={e=>onPointerDown(i,e)} style={{cursor:'grab'}}>
                <circle cx={cx} cy={cy} r={10} fill={col} stroke="#fff" strokeWidth={dragIdx===i?2.5:1.5} opacity={dragIdx===i?0.85:1}/>
                <text x={cx} y={cy+4} textAnchor="middle" fill="#fff" fontSize={7} fontWeight="700" fontFamily="system-ui" style={{pointerEvents:'none',userSelect:'none'}}>
                  {p.init}
                </text>
                {p.pos&&p.pos!==p.init&&<text x={cx} y={cy+18} textAnchor="middle" fill="#fff" fontSize={5.5} fontWeight="700" fontFamily="system-ui" style={{pointerEvents:'none',userSelect:'none',paintOrder:'stroke'}} stroke="rgba(0,0,0,.55)" strokeWidth={1.6}>
                  {p.pos}
                </text>}
              </g>
            );
          })}
        </svg>
        {editIdx!=null&&nodes[editIdx]&&(<>
          <div onPointerDown={()=>setEditIdx(null)} style={{position:'absolute',inset:0,zIndex:1}}/>
          <div style={{position:'absolute',zIndex:2,left:`${Math.max(20,Math.min(80,nodes[editIdx].x*100))}%`,top:nodes[editIdx].y>.55?'auto':`${nodes[editIdx].y*100+9}%`,bottom:nodes[editIdx].y>.55?`${(1-nodes[editIdx].y)*100+9}%`:'auto',transform:'translateX(-50%)',width:150,background:'var(--surface)',border:'1px solid var(--line)',borderRadius:10,padding:'9px 10px',boxShadow:'0 6px 20px rgba(0,0,0,.28)'}}>
            <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:7}}>
              <span style={{width:8,height:8,borderRadius:'50%',background:nodes[editIdx].team==='away'?awayColor:homeColor,flexShrink:0}}/>
              <span style={{font:'700 8px/1 var(--font)',color:'var(--faint)',letterSpacing:'.5px',textTransform:'uppercase'}}>{nodes[editIdx].team==='away'?'Opponent':'My Team'}</span>
            </div>
            <label style={{font:'700 8px/1 var(--font)',color:'var(--faint)',letterSpacing:'.4px',textTransform:'uppercase',display:'block',marginBottom:3}}>Initials</label>
            <input autoFocus value={nodes[editIdx].init} maxLength={4}
              onChange={e=>{const v=e.target.value.toUpperCase();setNodes(d=>{const n=[...d];n[editIdx]={...n[editIdx],init:v};return n;});}}
              onKeyDown={e=>{if(e.key==='Enter')setEditIdx(null);}}
              style={{width:'100%',textAlign:'center',font:'700 12px/1 var(--font)',color:'var(--ink)',border:'1.5px solid var(--t-400)',borderRadius:6,padding:'5px 4px',background:'var(--bg)',outline:'none',marginBottom:7,boxSizing:'border-box'}}/>
            <label style={{font:'700 8px/1 var(--font)',color:'var(--faint)',letterSpacing:'.4px',textTransform:'uppercase',display:'block',marginBottom:3}}>Position</label>
            <input value={nodes[editIdx].pos||''} maxLength={5}
              onChange={e=>{const v=e.target.value.toUpperCase();setNodes(d=>{const n=[...d];n[editIdx]={...n[editIdx],pos:v};return n;});}}
              onKeyDown={e=>{if(e.key==='Enter')setEditIdx(null);}}
              style={{width:'100%',textAlign:'center',font:'700 11px/1 var(--font)',color:'var(--ink)',border:'1px solid var(--line)',borderRadius:6,padding:'5px 4px',background:'var(--bg)',outline:'none',marginBottom:8,boxSizing:'border-box'}}/>
            <button onClick={()=>setEditIdx(null)} style={{width:'100%',background:'var(--t-500)',border:'none',borderRadius:7,padding:'7px',font:'700 10px/1 var(--font)',color:'#fff',cursor:'pointer'}}>Confirm Position</button>
          </div>
        </>)}
      </div>
      <div style={{font:'500 9px/1.3 var(--font)',color:'var(--faint)',marginTop:5,textAlign:'center'}}>Drag to reposition · Tap a player to set initials &amp; position</div>
      <div style={{display:'flex',gap:6,marginTop:8}}>
        <button onClick={()=>setSaveOpen(true)} style={{flex:1,background:'var(--t-500)',border:'none',borderRadius:8,padding:'9px',font:'700 11px/1 var(--font)',color:'#fff',cursor:'pointer'}}>Record Play</button>
        <button onClick={()=>setListOpen(!listOpen)} style={{flex:1,background:'none',border:'1.5px solid var(--t-400)',borderRadius:8,padding:'9px',font:'700 11px/1 var(--font)',color:'var(--t-600)',cursor:'pointer'}}>Play Log ({plays.length})</button>
      </div>
      {saveOpen&&<div style={{marginTop:8,background:'var(--t-50)',border:'1px solid var(--t-400)',borderRadius:10,padding:'10px 11px'}}>
        <div style={{font:'700 10px/1 var(--font)',color:'var(--t-600)',marginBottom:8}}>Capture every position at this moment</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,marginBottom:8}}>
          <div>
            <label style={{font:'700 8px/1 var(--font)',color:'var(--faint)',letterSpacing:'.4px',textTransform:'uppercase',display:'block',marginBottom:3}}>Period</label>
            <select value={period} onChange={e=>setPeriod(e.target.value)} style={{width:'100%',font:'600 10px/1 var(--font)',color:'var(--ink)',border:'1px solid var(--line)',borderRadius:7,padding:'7px 4px',background:'var(--surface)',outline:'none',boxSizing:'border-box'}}>
              {perList.map(o=><option key={o} value={o}>{o}</option>)}
            </select>
          </div>
          <div>
            <label style={{font:'700 8px/1 var(--font)',color:'var(--faint)',letterSpacing:'.4px',textTransform:'uppercase',display:'block',marginBottom:3}}>Clock</label>
            <input autoFocus value={clock} onChange={e=>onClock(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')savePlay();}} placeholder="7:45" inputMode="numeric" style={{width:'100%',textAlign:'center',font:'700 11px/1 var(--font)',color:'var(--ink)',border:'1px solid var(--line)',borderRadius:7,padding:'7px 4px',background:'var(--surface)',outline:'none',boxSizing:'border-box'}}/>
          </div>
          <div>
            <label style={{font:'700 8px/1 var(--font)',color:'var(--faint)',letterSpacing:'.4px',textTransform:'uppercase',display:'block',marginBottom:3}}>Result</label>
            <select value={result} onChange={e=>setResult(e.target.value)} style={{width:'100%',font:'600 10px/1 var(--font)',color:'var(--ink)',border:'1px solid var(--line)',borderRadius:7,padding:'7px 4px',background:'var(--surface)',outline:'none',boxSizing:'border-box'}}>
              {RESULT.map(o=><option key={o} value={o}>{o}</option>)}
            </select>
          </div>
        </div>
        <div style={{display:'flex',gap:6}}>
          <button onClick={savePlay} style={{flex:1,background:'var(--t-500)',border:'none',borderRadius:7,padding:'8px',font:'700 10px/1 var(--font)',color:'#fff',cursor:'pointer'}}>Save Positions</button>
          <button onClick={()=>setSaveOpen(false)} style={{flex:1,background:'none',border:'1px solid var(--line)',borderRadius:7,padding:'8px',font:'700 10px/1 var(--font)',color:'var(--faint)',cursor:'pointer'}}>Cancel</button>
        </div>
      </div>}
      {listOpen&&<div style={{marginTop:8,paddingBottom:56,display:'flex',flexDirection:'column',gap:6}}>
        {plays.length===0
          ? <div style={{font:'400 11px/1.4 var(--font)',color:'var(--faint)',textAlign:'center',padding:'12px 8px',background:'var(--bg)',border:'1px dashed var(--line)',borderRadius:8}}>No plays recorded yet. Set the players where they lined up, then tap Record Play — each entry stores every athlete’s position at that timestamp.</div>
          : plays.map(p=>(
            <div key={p.id} style={{background:'var(--surface)',border:'1px solid var(--line)',borderRadius:8,overflow:'hidden'}}>
              <div style={{display:'flex',alignItems:'center',gap:8,padding:'9px 10px'}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                    <span style={{font:'700 11px/1.2 var(--font)',color:'var(--ink)'}}>{p.period}{p.clock?' · '+p.clock:''}</span>
                    {p.result&&<span style={{flexShrink:0,font:'700 8px/1 var(--font)',color:'var(--t-600)',background:'var(--t-50)',borderRadius:4,padding:'3px 5px'}}>{p.result}</span>}
                  </div>
                  <div style={{font:'400 9px/1.2 var(--font)',color:'var(--faint)',marginTop:3}}>{p.ts} · {p.nodes.length} positions</div>
                </div>
                <button onClick={()=>loadPlay(p)} style={{flexShrink:0,background:'var(--t-50)',border:'1px solid var(--t-400)',borderRadius:6,padding:'6px 9px',font:'700 9px/1 var(--font)',color:'var(--t-600)',cursor:'pointer'}}>Replay</button>
                <button onClick={()=>persistPlays(plays.filter(x=>x.id!==p.id))} aria-label="Delete play" style={{flexShrink:0,background:'none',border:'none',font:'700 13px/1 var(--font)',color:'var(--faint)',cursor:'pointer',padding:'4px 2px'}}>×</button>
              </div>
              <button onClick={()=>setExpanded(expanded===p.id?null:p.id)} style={{width:'100%',textAlign:'left',background:'var(--bg)',border:'none',borderTop:'1px solid var(--line)',padding:'7px 10px',font:'700 9px/1 var(--font)',color:'var(--t-600)',cursor:'pointer',display:'flex',alignItems:'center',gap:5}}>
                <span style={{display:'inline-block',transform:expanded===p.id?'rotate(90deg)':'none',transition:'transform .18s'}}>▶</span>
                {expanded===p.id?'Hide Lineup':'View Lineup'}
              </button>
              {expanded===p.id&&<div style={{padding:'8px 10px 10px'}}>
                {['home','away'].map(tm=>{
                  const list=p.nodes.filter(n=>n.team===tm);
                  if(!list.length) return null;
                  return(
                    <div key={tm} style={{marginBottom:tm==='home'?8:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:5}}>
                        <span style={{width:7,height:7,borderRadius:'50%',background:tm==='away'?(p.awayColor||'#d1495b'):(p.homeColor||'#159385')}}/>
                        <span style={{font:'700 8px/1 var(--font)',color:'var(--faint)',letterSpacing:'.5px',textTransform:'uppercase'}}>{tm==='away'?'Opponent':'My Team'}</span>
                      </div>
                      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:4}}>
                        {list.map((n,i)=>(
                          <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:6,background:'var(--bg)',border:'1px solid var(--line)',borderRadius:5,padding:'4px 6px'}}>
                            <span style={{font:'700 9px/1.2 var(--font)',color:n.init===n.pos?'var(--faint)':'var(--ink)'}}>{n.init===n.pos?'—':n.init}</span>
                            <span style={{font:'500 9px/1.2 var(--font)',color:'var(--faint)'}}>{n.pos}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>}
            </div>
          ))}
      </div>}
    </div>
  );
}

function TodaySchedule(){
  const [open,setOpen]=useState(false);
  const [done,setDone]=useState({});
  const toggle=(i)=>setDone(d=>({...d,[i]:!d[i]}));
  const DRILLS=[
    {name:'Warm-up Jog',detail:'2 laps around the field'},
    {name:'Dynamic Stretching',detail:'10 min — leg swings, arm circles, high knees'},
    {name:'Ladder Drills',detail:'4 sets — quick feet, in-out, lateral shuffle'},
    {name:'Route Running',detail:'WRs & TEs — 6 routes each, focus on breaks'},
    {name:'7-on-7',detail:'3 series, no contact, QB reads coverage'},
    {name:'Red Zone Offense',detail:'5 plays from the 10-yard line'},
    {name:'Special Teams',detail:'Field goal unit — 5 attempts from 30 yds'},
    {name:'Conditioning Sprints',detail:'6×40-yard dashes, timed'},
    {name:'Cool Down & Film Review',detail:'15 min stretching + 10 min quick review'},
  ];
  return(
    <div style={{padding:'0 12px 12px'}}>
      <div style={{font:'700 11px/1 var(--font)',color:'var(--faint)',letterSpacing:'.8px',textTransform:'uppercase',marginBottom:8}}>TODAY'S SCHEDULE</div>
      <div className="card" style={{padding:0,overflow:'hidden'}}>
        <div onClick={()=>setOpen(!open)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 16px',cursor:'pointer'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:36,height:36,borderRadius:10,background:'var(--t-50)',border:'1px solid var(--t-100)',display:'flex',alignItems:'center',justifyContent:'center',font:'600 18px/1 var(--font)'}}>🏈</div>
            <div>
              <div style={{font:'700 14px/1 var(--font)',color:'var(--ink)'}}>Practice</div>
              <div style={{font:'400 11px/1 var(--font)',color:'var(--faint)',marginTop:2}}>4:00 PM · Main Field · {DRILLS.length} drills</div>
            </div>
          </div>
          <span style={{font:'600 18px/1 var(--font)',color:'var(--t-500)',transform:open?'rotate(90deg)':'none',transition:'transform .2s'}}>›</span>
        </div>
        {open&&<div style={{borderTop:'1px solid var(--line)',padding:'8px 16px 14px'}}>
          {DRILLS.map((d,i)=>(
            <div key={i} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'8px 0',borderTop:i>0?'1px solid var(--line)':'none'}}>
              <div style={{width:22,height:22,borderRadius:6,background:'var(--t-500)',display:'flex',alignItems:'center',justifyContent:'center',font:'700 10px/1 var(--font)',color:'#fff',flexShrink:0,marginTop:1}}>{i+1}</div>
              <div style={{flex:1}}>
                <div style={{font:'600 13px/1 var(--font)',color:done[i]?'var(--faint)':'var(--ink)',textDecoration:done[i]?'line-through':'none'}}>{d.name}</div>
                <div style={{font:'400 11px/1.4 var(--font)',color:'var(--faint)',marginTop:2}}>{d.detail}</div>
              </div>
              <div onClick={()=>toggle(i)} style={{width:20,height:20,borderRadius:5,border:`2px solid ${done[i]?'var(--t-500)':'var(--line)'}`,background:done[i]?'var(--t-500)':'transparent',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0,marginTop:1}}>
                {done[i]&&<svg width="11" height="9" viewBox="0 0 11 9" fill="none"><path d="M1 4l3 3 6-6" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
              </div>
            </div>
          ))}
        </div>}
      </div>
    </div>
  );
}

/* ── Sport Scoresheets ─────────────────────────────── */
const SS={fontSize:'9px',padding:'3px 4px',border:'1px solid var(--line)',whiteSpace:'nowrap',textAlign:'center'};
const SH={...SS,background:'var(--t-600)',color:'#fff',fontWeight:700};
const SD={...SS,background:'var(--surface)'};
const SAlt={...SS,background:'var(--t-50)'};

function FootballScoresheet(){
  const [qtr,setQtr]=React.useState(1);
  const [rows,setRows]=React.useState(()=>Array.from({length:20},()=>({ballOn:'',dn:'',plyr:'',rushYds:'',passFrom:'',passTo:'',passYds:'',notes:''})));
  const upd=(i,k,v)=>setRows(r=>{const n=[...r];n[i]={...n[i],[k]:v};return n;});
  return(
    <div style={{overflowX:'auto',padding:8}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
        <span style={{font:'700 11px/1 var(--font)',color:'var(--ink)'}}>FOOTBALL SCORESHEET</span>
        <div style={{display:'flex',gap:4,marginLeft:'auto'}}>
          {[1,2,3,4].map(q=><button key={q} onClick={()=>setQtr(q)} style={{padding:'3px 7px',border:'1px solid var(--t-400)',borderRadius:6,font:'600 9px/1 var(--font)',background:qtr===q?'var(--t-500)':'var(--t-50)',color:qtr===q?'#fff':'var(--t-600)',cursor:'pointer'}}>Q{q}</button>)}
        </div>
      </div>
      <table style={{borderCollapse:'collapse',width:'100%'}}>
        <thead>
          <tr>
            <th style={SH}>#</th>
            <th style={SH} colSpan={2}>PLAY SITUATION</th>
            <th style={SH} colSpan={2}>RUSH</th>
            <th style={SH} colSpan={3}>PASS</th>
            <th style={SH}>NOTES</th>
          </tr>
          <tr>
            <th style={SH}>PLAY</th>
            <th style={SH}>BALL ON</th>
            <th style={SH}>DN-DIST</th>
            <th style={SH}>PLYR</th>
            <th style={SH}>YDS</th>
            <th style={SH}>FROM</th>
            <th style={SH}>TO</th>
            <th style={SH}>YDS</th>
            <th style={SH}>NOTES</th>
          </tr>
        </thead>
        <tbody>{rows.map((r,i)=>{
          const s=i%2===0?SD:SAlt;
          return(<tr key={i}>
            <td style={{...s,fontWeight:700,color:'var(--faint)'}}>{i+1}</td>
            {['ballOn','dn','plyr','rushYds','passFrom','passTo','passYds','notes'].map(k=>(
              <td key={k} style={s}><input value={r[k]} onChange={e=>upd(i,k,e.target.value)} style={{width:k==='notes'?60:28,border:'none',background:'transparent',font:'500 9px/1 var(--font)',outline:'none',textAlign:'center'}}/></td>
            ))}
          </tr>);
        })}</tbody>
        <tfoot><tr><td colSpan={9} style={{...SH,textAlign:'left',paddingLeft:6}}>TOTALS THIS QTR</td></tr></tfoot>
      </table>
      <div style={{display:'flex',gap:8,marginTop:8,flexWrap:'wrap'}}>
        <table style={{borderCollapse:'collapse'}}>
          <thead><tr><th style={SH}>1ST DOWNS</th>{[1,2,3,4,5,6,7].map(n=><th key={n} style={SH}>{n}</th>)}</tr></thead>
          <tbody>{['BY PASS','BY RUSH','BY PENALTY'].map(row=>(<tr key={row}><td style={SD}>{row}</td>{[1,2,3,4,5,6,7].map(n=><td key={n} style={SD}></td>)}</tr>))}</tbody>
        </table>
        <table style={{borderCollapse:'collapse'}}>
          <thead><tr><th style={SH} colSpan={2}>TIMEOUTS</th></tr></thead>
          <tbody>{[1,2,3].map(n=><tr key={n}><td style={SD}>{n}</td><td style={{...SD,width:40}}></td></tr>)}</tbody>
        </table>
      </div>
      <div style={{marginTop:8}}>
        <div style={{font:'700 9px/1 var(--font)',color:'var(--faint)',marginBottom:4,letterSpacing:.6}}>TURNOVERS &amp; RETURNS</div>
        <table style={{borderCollapse:'collapse',width:'100%'}}>
          <thead><tr>{['PLAY/CLOCK','F/INT BY #','REC/INT BY #','FROM YD','TO YD','TOTAL YDS'].map(h=><th key={h} style={SH}>{h}</th>)}</tr></thead>
          <tbody>{[0,1,2,3,4,5,6,7].map(i=><tr key={i}>{[0,1,2,3,4,5].map(j=><td key={j} style={i%2===0?SD:SAlt}><input style={{width:j===0?50:32,border:'none',background:'transparent',font:'500 9px/1 var(--font)',outline:'none',textAlign:'center'}}/></td>)}</tr>)}</tbody>
        </table>
      </div>
      <div style={{marginTop:8}}>
        <div style={{font:'700 9px/1 var(--font)',color:'var(--faint)',marginBottom:4,letterSpacing:.6}}>PENALTIES</div>
        <table style={{borderCollapse:'collapse',width:'100%'}}>
          <thead><tr>{['PLAY','TEAM','PLYR','YDS','TYPE'].map(h=><th key={h} style={SH}>{h}</th>)}</tr></thead>
          <tbody>{[0,1,2,3,4].map(i=><tr key={i}>{[0,1,2,3,4].map(j=><td key={j} style={i%2===0?SD:SAlt}><input style={{width:j===4?60:32,border:'none',background:'transparent',font:'500 9px/1 var(--font)',outline:'none',textAlign:'center'}}/></td>)}</tr>)}</tbody>
        </table>
      </div>
      <div style={{marginTop:8}}>
        <div style={{font:'700 9px/1 var(--font)',color:'var(--faint)',marginBottom:4,letterSpacing:.6}}>KICKING GAME</div>
        <table style={{borderCollapse:'collapse',width:'100%'}}>
          <thead>
            <tr>
              <th style={SH} colSpan={7}>KICK</th>
              <th style={SH} colSpan={5}>RETURN</th>
            </tr>

            {cats.map((c,i)=>(<div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:'var(--bg)',border:'1px solid var(--line)',borderRadius:8,padding:'9px 11px'}}><span style={{font:'600 12px/1 var(--font)',color:'var(--ink)'}}>{c}</span><button onClick={()=>setCats(cs=>cs.filter((_,j)=>j!==i))} style={{background:'none',border:'none',font:'600 15px/1 var(--font)',color:'var(--faint)',cursor:'pointer'}}>×</button></div>))}
          </div>
          <div style={{display:'flex',gap:8}}>
            <input value={newCat} onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&newCat.trim()){setCats(c=>[...c,newCat.trim()]);setNewCat('');}}} placeholder="Add category…" style={{...inp,flex:1}}/>
            <button onClick={()=>{if(newCat.trim()){setCats(c=>[...c,newCat.trim()]);setNewCat('');}}} style={{background:'var(--t-500)',border:'none',borderRadius:8,padding:'0 16px',font:'700 18px/1 var(--font)',color:'#fff',cursor:'pointer'}}>+</button>
          </div>
        </div>}

        {view==='custom'&&step===4&&<div>
          <div style={{font:'700 12px/1 var(--font)',color:'var(--t-600)',marginBottom:4}}>Step 4 · Score Sheet</div>

              {events.length>1&&<button onClick={()=>setEvents(es=>es.filter((_,j)=>j!==i))} style={{background:'none',border:'none',font:'600 16px/1 var(--font)',color:'var(--faint)',cursor:'pointer'}}>×</button>}
            </div>
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>{METRICS.map(m=>(<CTChip key={m} on={!!ev.metrics[m]} onClick={()=>setEvents(es=>es.map((x,j)=>j===i?{...x,metrics:{...x.metrics,[m]:!x.metrics[m]}}:x))}>{m}</CTChip>))}</div>
          </div>))}
          <button onClick={()=>setEvents(es=>[...es,{name:'',metrics:{'Time':true,'Placement':true}}])} style={{width:'100%',background:'none',border:'1.5px dashed var(--t-400)',borderRadius:10,padding:'11px',font:'700 12px/1 var(--font)',color:'var(--t-600)',cursor:'pointer'}}>+ Add Event</button>
        </div>}

        </div>
        <div style={{display:'flex',gap:10,marginTop:16,flexShrink:0}}>
          {view==='choose'&&<button onClick={onClose} style={ghostBtn}>Cancel</button>}
          {view==='preset'&&<>
            <button onClick={()=>setView('choose')} style={ghostBtn}>Back</button>
            <button onClick={()=>onCreate&&onCreate({type:'preset',preset,org,teamName})} style={primaryBtn}>Create Team</button>
          </>}
          {view==='custom'&&<>
            <button onClick={()=>{if(step===1)setView('choose');else setStep(s=>s-1);}} style={ghostBtn}>Back</button>
            {step<4?<button onClick={()=>setStep(s=>s+1)} style={primaryBtn}>Next</button>:<button onClick={()=>onCreate&&onCreate({type:'custom',sportName,org,teamName,ageGroup,season,tracking,cats,events})} style={primaryBtn}>Create Team</button>}
          </>}
        </div>
      </div>
    </div>
  );
}

function CDash({onNav,onSwitch,onOpenMenu}){

  const [qaType,setQaType]=useState('Note');
  const [qaAth,setQaAth]=useState(C_ATH[0].name);

    basketball:['Scoresheet','Game 1 - Jul 5 (W 88-72)','Game 2 - Jul 8 (W 95-80)','Game 3 - Jul 12 (L 64-78)'],

  };

  const [newTeamName,setNewTeamName]=useState('');
  const [newTeamSport,setNewTeamSport]=useState('Basketball');
  const [selTeam,setSelTeam]=useState('football');
  const TEAMS={football:{name:'Football',athletes:C_ATH},baseball:{name:'Baseball',athletes:C_ATH.map((a,i)=>({...a,pos:['Pitcher','Catcher','Shortstop','First Base','Center Field','Relief Pitcher'][i],sport:'Baseball'}))},basketball:{name:'Basketball',athletes:C_ATH.map((a,i)=>({...a,pos:['PG','SG','SF','PF','C','6th Man','Backup PG','Backup SG','Backup SF','Backup PF','Backup C'][i],sport:'Basketball'}))},soccer:{name:'Soccer',athletes:C_ATH.map((a,i)=>({...a,pos:['Goalkeeper','Center Back','Right Back','Central Mid','Left Wing','Striker'][i],sport:'Soccer'}))}};
  const allTeams={...TEAMS,...customTeams};
  const athletes=allTeams[selTeam]?.athletes||C_ATH;
  const counts={Active:Object.values(attStatus).filter(s=>s==='Active').length,Recovery:Object.values(attStatus).filter(s=>s==='Recovery').length,Injured:Object.values(attStatus).filter(s=>s==='Injured').length};
  return (<div>

      </div>
      <div className="app-greeting">Coach Dashboard</div>
    </div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 12px 8px'}}>
      <span style={{font:'700 11px/1 var(--font)',color:'var(--faint)',letterSpacing:'.8px',textTransform:'uppercase'}}>TEAM OVERVIEW</span>
      <button onClick={()=>setAttOpen(true)} style={{border:'1px solid var(--t-400)',borderRadius:8,padding:'5px 10px',font:'600 10px/1 var(--font)',color:'var(--t-600)',background:'var(--t-50)',outline:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:5}}>Attendance <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
    </div>
    <div style={{display:'flex',gap:8,padding:'0 12px 12px'}}>{Object.entries(counts).map(([lbl,n])=>(<div key={lbl} onClick={()=>onNav('cathletes',a.id)} style={{flex:1,background:'var(--surface)',border:'1px solid var(--line)',borderRadius:12,padding:'10px 8px',textAlign:'center',cursor:'pointer'}}><div style={{font:'700 22px/1 var(--font)',color:STT_[lbl]||'var(--ink)'}}>{n}</div><div style={{font:'500 10px/1.2 var(--font)',color:'var(--faint)',marginTop:3}}>{lbl}</div></div>))}</div>

    {/* TODAY ATTENDANCE */}

    {showCreateTeam&&<CreateTeamModal onClose={()=>setShowCreateTeam(false)} onCreate={(data)=>{

      const nm=(data.teamName||data.sportName||'New Team').trim();

      const team={name:nm,sport:data.sportName||'Custom Sport',season:data.season,ageGroup:data.ageGroup,org:data.org,custom:true,view:null,events:data.events||[],metrics:(metricSet.length?metricSet:['Score']),athletes:C_ATH.map(a=>({...a,sport:data.sportName||'Custom Sport'}))};
      setCustomTeams(t=>({...t,[key]:team}));

      setSheetOpen(true);

            <option value="create">➕ Create Team</option>
          </select>
          <button onClick={()=>setSheetOpen(o=>!o)} style={{flex:1,minWidth:0,border:'1px solid var(--t-400)',borderRadius:8,padding:'6px 4px',font:'600 10px/1 var(--font)',color:sheetOpen?'#fff':'var(--t-600)',background:sheetOpen?'var(--t-500)':'var(--t-50)',cursor:'pointer'}}>
            {sheetOpen?'▼ Sheet':'▶ Sheet'}
          </button>
          <button onClick={()=>{setFieldOpen(o=>!o);setAthleteListOpen(o=>!o);}} style={{flex:1,minWidth:0,border:'1px solid var(--t-400)',borderRadius:8,padding:'6px 4px',font:'600 10px/1 var(--font)',color:fieldOpen?'#fff':'var(--t-600)',background:fieldOpen?'var(--t-500)':'var(--t-50)',cursor:'pointer'}}>
            {fieldOpen?'▼ Field':'▶ Field'}
          </button>
      </div>

      {sheetOpen&&<div className="card" style={{padding:0,maxHeight:420,overflowY:'auto',overflowX:'hidden',marginBottom:0}}><SportScoresheet sport={selTeam} meta={allTeams[selTeam]}/></div>}

      {/* Field / Court View Card */}
            {fieldView&&fieldOpen&&<div className="card" style={{padding:8,overflow:'hidden',marginBottom:0}}>
        <FieldDiagram type={fieldView} athletes={athletes}/>
      </div>}


    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 14px 8px'}}><span style={{font:'700 11px/1 var(--font)',color:'var(--faint)',letterSpacing:'.8px',textTransform:'uppercase'}}>RECENT NOTES</span><button onClick={()=>{setQaType('Note');setShowQA(true);}} style={{background:'var(--t-500)',border:'none',borderRadius:8,padding:'5px 10px',font:'600 11px/1 var(--font)',color:'#fff',cursor:'pointer'}}>+ Note</button></div>
    <div className="card">{C_NOTES.map((n,i)=>(<div key={i} style={{padding:'8px 0',borderTop:i>0?'1px solid var(--line)':'none'}}><div style={{display:'flex',justifyContent:'space-between',marginBottom:2}}><span style={{font:'600 12px/1 var(--font)',color:'var(--ink)'}}>{n.athlete}</span><span style={{font:'400 10px/1 var(--font)',color:'var(--faint)'}}>{n.date}</span></div><div style={{font:'400 12px/1.4 var(--font)',color:'var(--faint)'}}>{n.note}</div></div>))}</div>
    <div style={{padding:'4px 14px 8px'}}><span style={{font:'700 11px/1 var(--font)',color:'var(--faint)',letterSpacing:'.8px',textTransform:'uppercase'}}>WEEKLY WORKLOAD</span></div>
    <div className="card"><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>{[['Total Sessions','5'],['High Intensity','2'],['Medium Intensity','2'],['Recovery','1']].map(([l,v])=>(<div key={l} style={{background:'var(--t-50)',borderRadius:10,padding:'10px 12px'}}><div style={{font:'400 11px/1 var(--font)',color:'var(--faint)',marginBottom:4}}>{l}</div><div style={{font:'700 15px/1 var(--font)',color:'var(--t-600)'}}>{v}</div></div>))}</div></div>
    <div style={{padding:'4px 14px 8px'}}><span style={{font:'700 11px/1 var(--font)',color:'var(--faint)',letterSpacing:'.8px',textTransform:'uppercase'}}>PRACTICE COMPLETION</span></div>
    <div className="card"><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>{[['Drills Completed','94%'],['Plans Executed','3 of 3'],['Skipped','1 drill'],['On Track','Yes']].map(([l,v])=>(<div key={l} style={{background:'var(--t-50)',borderRadius:10,padding:'10px 12px'}}><div style={{font:'400 11px/1 var(--font)',color:'var(--faint)',marginBottom:4}}>{l}</div><div style={{font:'700 15px/1 var(--font)',color:'var(--t-600)'}}>{v}</div></div>))}</div></div>
    
  
    {showQA&&<div style={{position:'fixed',inset:0,zIndex:900,background:'rgba(0,0,0,.45)',display:'flex',alignItems:'center',justifyContent:'center',padding:20}} onClick={()=>setShowQA(false)}>
      <div onClick={e=>e.stopPropagation()} style={{background:'var(--surface)',borderRadius:16,padding:22,width:'100%',maxWidth:340,boxShadow:'0 20px 60px rgba(0,0,0,.25)'}}>
        <div style={{font:'700 16px/1 var(--font)',color:'var(--ink)',marginBottom:14}}>+ {qaType}</div>
        <div style={{font:'600 11px/1 var(--font)',color:'var(--faint)',marginBottom:6}}>Athlete</div>
        <select value={qaAth} onChange={e=>setQaAth(e.target.value)} style={{width:'100%',border:'1px solid var(--line)',borderRadius:8,padding:'9px 10px',font:'400 13px/1 var(--font)',color:'var(--ink)',background:'var(--bg)',marginBottom:12}}>{C_ATH.map(a=><option key={a.id}>{a.name}</option>)}</select>
        <div style={{font:'600 11px/1 var(--font)',color:'var(--faint)',marginBottom:6}}>Note</div>
        <textarea value={qaText} onChange={e=>setQaText(e.target.value)} placeholder="Enter notes…" rows={4} style={{width:'100%',border:'1px solid var(--line)',borderRadius:8,padding:'9px 10px',font:'400 13px/1.5 var(--font)',color:'var(--ink)',background:'var(--bg)',resize:'none',outline:'none',marginBottom:14}}/>
        <div style={{display:'flex',gap:8}}>

          <button onClick={()=>setShowQA(false)} style={{flex:1,background:'var(--bg)',border:'1px solid var(--line)',borderRadius:10,padding:'11px',font:'600 13px/1 var(--font)',color:'var(--faint)',cursor:'pointer'}}>Cancel</button>
        </div>

    </div>}
  </div>);

function fmtSW(ms){const min=Math.floor(ms/60000),sec=Math.floor((ms%60000)/1000),cs=Math.floor((ms%1000)/10);return(min>0?String(min).padStart(2,'0')+':':'')+String(sec).padStart(2,'0')+'.'+String(cs).padStart(2,'0');}
function StopwatchModal({onClose,athleteName,running,elapsed,laps,onStart,onStop,onReset,onLap}){
  return(
    <div style={{position:'fixed',inset:0,zIndex:800,background:'rgba(0,0,0,.55)',display:'flex',alignItems:'flex-end',justifyContent:'center'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:390,background:'#fff',borderRadius:'20px 20px 0 0',padding:'20px 20px 32px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
          <div><div style={{font:'700 15px/1 var(--font)',color:'var(--ink)'}}>Stopwatch</div><div style={{font:'400 11px/1 var(--font)',color:'var(--faint)',marginTop:2}}>{athleteName}</div></div>
          <button onClick={onClose} style={{background:'none',border:'none',font:'500 13px/1 var(--font)',color:'var(--faint)',cursor:'pointer'}}>✕ Close</button>
        </div>
        <div style={{textAlign:'center',padding:'20px 0 24px',font:'700 52px/1 var(--font)',color:'var(--ink)',letterSpacing:'-2px',fontVariantNumeric:'tabular-nums'}}>{fmtSW(elapsed)}</div>
        <div style={{display:'flex',gap:10,marginBottom:16}}>
          {!running?<button onClick={onStart} style={{flex:2,background:'var(--t-500)',border:'none',borderRadius:12,padding:'14px',font:'700 15px/1 var(--font)',color:'#fff',cursor:'pointer'}}>{elapsed>0?'Resume':'Start'}</button>:<button onClick={onStop} style={{flex:2,background:'#ef4444',border:'none',borderRadius:12,padding:'14px',font:'700 15px/1 var(--font)',color:'#fff',cursor:'pointer'}}>Stop</button>}
          <button onClick={running?onLap:onReset} style={{flex:1,background:'var(--line)',border:'none',borderRadius:12,padding:'14px',font:'600 13px/1 var(--font)',color:'var(--ink)',cursor:'pointer'}}>{running?'Lap':'Reset'}</button>
        </div>
        {laps.length>0&&<div style={{maxHeight:140,overflowY:'auto'}}>{laps.map((l,i)=><div key={i} style={{display:'flex',justifyContent:'space-between',padding:'7px 0',borderTop:'1px solid var(--line)'}}><span style={{font:'500 12px/1 var(--font)',color:'var(--faint)'}}>Lap {i+1}</span><span style={{font:'700 13px/1 var(--font)',color:'var(--ink)',fontVariantNumeric:'tabular-nums'}}>{fmtSW(l)}</span></div>)}</div>}
      </div>
    </div>
  );
}
